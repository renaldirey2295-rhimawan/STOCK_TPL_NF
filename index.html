<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Input Stock OH TPL & Nonfood</title>
<style>
:root{--blue:#1239d8;--bg:#f4f6fb;--ink:#172033;--muted:#687386;--line:#e4e8f0;--green:#138a55;--red:#c83b3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}.wrap{max-width:1100px;margin:auto;padding:22px 16px 48px}.top{background:linear-gradient(120deg,#142fc4,#4268f5);color:white;padding:24px;border-radius:18px}.top h1{margin:0 0 7px;font-size:24px}.top p{margin:0;opacity:.88}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 5px 20px #14264b0a}.tabs{display:flex;gap:8px;margin-top:16px}.tab,button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.tab{background:#e9edff;color:#253ca7}.tab.active{background:var(--blue);color:white}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}input{border:1px solid #d7dce7;border-radius:9px;padding:11px 12px;font:inherit;min-width:180px}button.primary{background:var(--blue);color:white}button.secondary{background:#edf0f6;color:#273247}button.save{background:var(--green);color:white;padding:9px 12px}button:disabled{opacity:.5;cursor:not-allowed}.status{margin-top:12px;color:var(--muted);font-size:13px}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.pill{background:#f0f3fa;padding:8px 12px;border-radius:9px;font-size:13px}.tablewrap{overflow:auto;margin-top:14px}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{background:#f1f4fb;color:#3a465d;font-size:12px;text-transform:uppercase;position:sticky;top:0}td.num{text-align:right;font-variant-numeric:tabular-nums}.ohinput{width:110px;min-width:0;text-align:right;padding:8px}.action{white-space:nowrap}.positive{color:var(--green);font-weight:700}.negative{color:var(--red);font-weight:700}.empty{text-align:center;padding:28px;color:var(--muted)}@media(max-width:600px){.wrap{padding:12px}.top{padding:18px}.top h1{font-size:20px}.panel{padding:13px}.controls>*{width:100%}.field input{width:100%}}
</style></head>
<body><main class="wrap">
<header class="top"><h1>INPUT STOCK OH</h1><p>Input dan koreksi On Hand Product TPL & NONFOOD</p></header>
<nav class="tabs"><button class="tab active" data-type="TPL">STOCK OH TPL</button><button class="tab" data-type="NONFOOD">STOCK NONFOOD</button></nav>
<section class="panel"><div class="controls"><div class="field"><label for="date">TANGGAL INPUT</label><input type="date" id="date"></div><button class="primary" id="load">Tampilkan Data</button><button class="secondary" id="reload">Muat Ulang</button></div><div id="status" class="status">Pilih tanggal untuk menampilkan data.</div><div class="summary" id="summary"></div><div class="tablewrap"><table><thead><tr><th>Kode</th><th>Nama Barang</th><th>Satuan</th><th>Akhir</th><th>OH</th><th>Selisih</th><th>Aksi</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">Belum ada data ditampilkan.</td></tr></tbody></table></div></section>
</main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyaEF1as-Xhifg9WYgdI6aqq6cmPOeIGT9NSG_aQhFlKww2kBpfefBN0ND-s6yUrsp7Iw/exec';
let currentType='TPL', currentItems=[];
const $=id=>document.getElementById(id);
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function api(action,args={}){return new Promise((resolve,reject)=>{if(!API_URL||API_URL.includes('PASTE_URL'))return reject(new Error('Isi API_URL dengan URL Web App Apps Script terlebih dahulu.'));const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);const s=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(new Error('Waktu koneksi habis. Periksa URL/deployment Apps Script.'))},25000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=r=>{cleanup();if(!r||!r.ok)return reject(new Error(r?.error||'Respons API tidak valid.'));resolve(r.data)};s.onerror=()=>{cleanup();reject(new Error('Gagal menghubungi Apps Script.'))};s.src=API_URL+'?api=1&action='+encodeURIComponent(action)+'&callback='+cb+'&args='+encodeURIComponent(JSON.stringify(args));document.body.appendChild(s)})}
function fmt(v){if(v===null||v===undefined||v==='')return '—';return Number(v).toLocaleString('id-ID',{maximumFractionDigits:3})}
function setStatus(t){$('status').textContent=t}
function render(){const body=$('rows');body.innerHTML='';let filled=0,minus=0,plus=0;currentItems.forEach((it,i)=>{if(it.oh!==null&&it.oh!==undefined&&it.oh!=='')filled++;if((it.selisih||0)<0)minus++;if((it.selisih||0)>0)plus++;const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(it.kode)}</td><td><b>${esc(it.nama)}</b></td><td>${esc(it.satuan)}</td><td class="num">${fmt(it.akhir)}</td><td class="num"><input class="ohinput" id="input-${i}" type="number" min="0" step="any" value="${it.oh??''}" placeholder="Input OH" aria-label="Input OH ${esc(it.nama)}"></td><td class="num ${it.selisih<0?'negative':it.selisih>0?'positive':''}" id="sel-${i}">${fmt(it.selisih)}</td><td class="action"><button class="save" data-save="${i}">${it.oh===null||it.oh===undefined||it.oh===''?'Simpan':'Simpan'}</button></td>`;body.appendChild(tr)});if(!currentItems.length)body.innerHTML='<tr><td colspan="7" class="empty">Tidak ada item. Periksa daftar kode pada sheet.</td></tr>';$('summary').innerHTML=`<span class="pill">Total item: <b>${currentItems.length}</b></span><span class="pill">Sudah input: <b>${filled}</b></span><span class="pill">Selisih minus: <b>${minus}</b></span><span class="pill">Selisih plus: <b>${plus}</b></span>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){const date=$('date').value;if(!date)return setStatus('Pilih tanggal terlebih dahulu.');$('load').disabled=true;setStatus('Mengambil data...');try{const r=await api('getStockOhWeb',{type:currentType,date});currentItems=r.items||[];render();setStatus(`${currentType}: ${currentItems.length} item untuk ${date}. Input baru maupun edit akan disimpan pada tanggal ini.`)}catch(e){setStatus('Gagal: '+e.message)}finally{$('load').disabled=false}}
async function saveRow(i){const it=currentItems[i],v=$(`input-${i}`).value;if(v.trim()==='')return alert('Isi angka OH terlebih dahulu.');const btn=document.querySelector(`[data-save="${i}"]`);btn.disabled=true;try{const r=await api('saveStockOhWeb',{type:currentType,date:$('date').value,kode:it.kode,value:v});setStatus(r.message);await load()}catch(e){alert(e.message);btn.disabled=false}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));currentType=b.dataset.type;load()}));$('load').addEventListener('click',load);$('reload').addEventListener('click',load);$('date').value=today();$('rows').addEventListener('click',e=>{const t=e.target;if(t.dataset.save!==undefined)saveRow(Number(t.dataset.save))});
</script></body></html>
